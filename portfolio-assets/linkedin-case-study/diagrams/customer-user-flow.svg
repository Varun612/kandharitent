<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#faf7f2; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e4e" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a0e4e" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c59a3f" />
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1600" height="120" fill="url(#purpleGrad)" />
  <rect x="0" y="116" width="1600" height="4" fill="url(#goldGrad)" />
  <text x="60" y="55" fill="#faf7f2" font-size="28" font-weight="700" letter-spacing="0.5">KANDHARI TENT HOUSE &amp; DWARKA SHRI LAWN, LUCKNOW</text>
  <text x="60" y="90" fill="#d4af37" font-size="16" font-weight="600" letter-spacing="1">END-TO-END CUSTOMER DISCOVERY, RENTAL PRICING &amp; BOOKING USER FLOW</text>
  <rect x="1380" y="42" width="160" height="36" rx="18" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="1.5" />
  <text x="1460" y="65" fill="#d4af37" font-size="13" font-weight="600" text-anchor="middle">LIVE VERIFIED</text>

  <!-- Flow Grid: 6 Cards in 2 Rows (3 columns each) -->

  <!-- CARD 1: Discovery -->
  <g transform="translate(60, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Digital Discovery &amp; Venue Hero</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Responsive Awadhi Wedding Experience</text>
    <text x="40" y="110" fill="#666666" font-size="13">Kanpur Road, Opp. Pillar 37, Daroga Kheda credentials</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Verified Venue Metrics Highlighted</text>
    <text x="40" y="170" fill="#666666" font-size="13">25,000 sq.ft event grounds, 1000+ guest capacity, 7+ AC rooms</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Seamless Call-to-Actions</text>
    <text x="40" y="230" fill="#666666" font-size="13">Direct WhatsApp inquiry button + interactive rental cart trigger</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: User explores venue credentials and rental overview</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="510" y1="310" x2="570" y2="310" stroke="#c59a3f" stroke-width="3" marker-end="url(#arrow)" />

  <!-- CARD 2: Catalogue & Dimension Sizing -->
  <g transform="translate(575, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Multi-Category Rental Catalogue</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• 19+ Standardized Equipment Items</text>
    <text x="40" y="110" fill="#666666" font-size="13">PVC Chairs (₹15), Velvet Covers (₹45), Round Tables (₹200)</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Dimension &amp; Area-Based Sizing</text>
    <text x="40" y="170" fill="#666666" font-size="13">Normal Pandal (₹5/sq ft), Waterproof Hangar (₹30/sq ft)</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Authentic Photography &amp; Inventory Badges</text>
    <text x="40" y="230" fill="#666666" font-size="13">Live availability indicators with clear rental duration terms</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: Customer selects items, quantities &amp; tent dimensions</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="1025" y1="310" x2="1085" y2="310" stroke="#c59a3f" stroke-width="3" marker-end="url(#arrow)" />

  <!-- CARD 3: Video Tour & 7 Reels -->
  <g transform="translate(1090, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Dwarka Shri Lawn Video Showcase</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Full-Width 2m 13s WhatsApp Tour</text>
    <text x="40" y="110" fill="#666666" font-size="13">Raw authentic footage of entrance, lawn, and bridal rooms</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• 7 Vertical 9:16 Cinematic Reels Gallery</text>
    <text x="40" y="170" fill="#666666" font-size="13">Pre-cut HD clips with modal player, MP4 download &amp; WhatsApp share</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• 6 Visual Venue Area Tabs</text>
    <text x="40" y="230" fill="#666666" font-size="13">Entrance, Main Grounds, Halwai Kitchen, AC Hall, Stage, Rooms</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: Customer inspects real facility videos &amp; area zones</text>
  </g>

  <!-- Connecting Line from Row 1 to Row 2 -->
  <path d="M 1315 460 L 1315 510 L 285 510 L 285 540" fill="none" stroke="#c59a3f" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow)" />

  <!-- CARD 4: Pricing Engine & Cartage -->
  <g transform="translate(60, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Authoritative Mathematical Pricing</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Area Calculation Formula</text>
    <text x="40" y="110" fill="#666666" font-size="13">(Length × Width) × Rate per sq.ft × Rental Days × Quantity</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Transparent Distance Band Cartage</text>
    <text x="40" y="170" fill="#666666" font-size="13">0–3 km (₹500+₹500) | 3–7 km (₹1k+₹1k) | &gt;7 km (provisional)</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Inclusive Calendar Day Rental Math</text>
    <text x="40" y="230" fill="#666666" font-size="13">E.g., Dec 10 to Dec 11 = 2 calendar rental days</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: Transparent quotation generated with zero hidden costs</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="510" y1="700" x2="570" y2="700" stroke="#c59a3f" stroke-width="3" marker-end="url(#arrow)" />

  <!-- CARD 5: Catering & Enquiry Form -->
  <g transform="translate(575, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Event Customization &amp; Submission</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• 125 Pure Veg Awadhi Catering Dishes</text>
    <text x="40" y="110" fill="#666666" font-size="13">Curated across 17 traditional categories &amp; 8 festive packages</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Enquiry Details &amp; Validation</text>
    <text x="40" y="170" fill="#666666" font-size="13">Client name, event date, guest count, and locality</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Dual Channel Handoff</text>
    <text x="40" y="230" fill="#666666" font-size="13">Stores in database + auto-generates structured WhatsApp quote</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: Customer submits booking enquiry to backend</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="1025" y1="700" x2="1085" y2="700" stroke="#c59a3f" stroke-width="3" marker-end="url(#arrow)" />

  <!-- CARD 6: 6-Step Pre-Approval & Payment -->
  <g transform="translate(1090, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#purpleGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">6</text>
    <text x="68" y="30" fill="#4a0e4e" font-size="16" font-weight="700">Pre-Approval &amp; Advance Payment</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Pre-Approval Security Gate</text>
    <text x="40" y="110" fill="#666666" font-size="13">Booking stays "Pending Admin Review" (payment locked)</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Admin Quotation Confirmation</text>
    <text x="40" y="170" fill="#666666" font-size="13">Admin verifies inventory/dates -> issues final approved quote</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Cryptographic Razorpay Settlement</text>
    <text x="40" y="230" fill="#666666" font-size="13">Customer accepts -> 50% advance captured -> dates locked</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">OUTCOME: Event booked, calendar locked &amp; commercial invoice created</text>
  </g>
</svg>