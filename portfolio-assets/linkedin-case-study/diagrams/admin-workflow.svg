<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#faf7f2; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#19042b" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="adminShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <marker id="arrowAdmin" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d4af37" />
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1600" height="120" fill="url(#adminGrad)" />
  <rect x="0" y="116" width="1600" height="4" fill="url(#goldGrad2)" />
  <text x="60" y="55" fill="#faf7f2" font-size="28" font-weight="700" letter-spacing="0.5">KANDHARI TENT &amp; DWARKA SHRI LAWN — BUSINESS OPERATIONS PORTAL</text>
  <text x="60" y="90" fill="#d4af37" font-size="16" font-weight="600" letter-spacing="1">UNIFIED 11-SECTION BILINGUAL ADMINISTRATIVE WORKFLOW &amp; GOVERNANCE</text>
  <rect x="1360" y="42" width="180" height="36" rx="18" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="1.5" />
  <text x="1450" y="65" fill="#d4af37" font-size="13" font-weight="600" text-anchor="middle">ROLE-BASED AUTH</text>

  <!-- Row 1: Auth Guard -> Dashboard KPIs -> Quotation Pipeline -->

  <!-- CARD 1: Auth & Role Enforcement -->
  <g transform="translate(60, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">Dual-Identifier Auth &amp; Protection</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Secure Dual Login Portal (/admin/login)</text>
    <text x="40" y="110" fill="#666666" font-size="13">Supports Username ("admin") OR Verified Email ("varunkandhari...")</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• 10-Round Salted Bcrypt Hashing</text>
    <text x="40" y="170" fill="#666666" font-size="13">Zero plaintext passwords stored; CLI recovery script protection</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Strict Backend JWT Role Guards</text>
    <text x="40" y="230" fill="#666666" font-size="13">Customer tokens strictly blocked with HTTP 403 Forbidden</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">SECURITY: Cryptographically signed 24h administrator session</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="510" y1="310" x2="570" y2="310" stroke="#d4af37" stroke-width="3" marker-end="url(#arrowAdmin)" />

  <!-- CARD 2: Dashboard Overview -->
  <g transform="translate(575, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">11-Section Unified Dashboard</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Mother-Friendly Bilingual UI</text>
    <text x="40" y="110" fill="#666666" font-size="13">Simple Hindi-English labels designed for non-technical family users</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Live Operational KPIs</text>
    <text x="40" y="170" fill="#666666" font-size="13">Total revenue, active wedding bookings, today's staff on duty</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Pending Liabilities Monitor</text>
    <text x="40" y="230" fill="#666666" font-size="13">Quick summaries of unpaid dhobi &amp; bamboo contractor accounts</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">CAPABILITY: Instant operational pulse &amp; quick navigation</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="1025" y1="310" x2="1085" y2="310" stroke="#d4af37" stroke-width="3" marker-end="url(#arrowAdmin)" />

  <!-- CARD 3: Quotation & Pipeline -->
  <g transform="translate(1090, 160)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">Enquiry &amp; Booking Pipeline</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Status Pipeline Lifecycle</text>
    <text x="40" y="110" fill="#666666" font-size="13">New ➔ In Discussion ➔ Approved Quotation ➔ Confirmed</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Quotation Revision Engine</text>
    <text x="40" y="170" fill="#666666" font-size="13">Admin inspects date availability, applies discounts or cartage notes</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• CSV Ledger Export</text>
    <text x="40" y="230" fill="#666666" font-size="13">One-click full booking history export for offline tax &amp; records</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">ACTION: Admin confirms warehouse inventory &amp; issues formal quote</text>
  </g>

  <!-- Connecting Line from Row 1 to Row 2 -->
  <path d="M 1315 460 L 1315 510 L 285 510 L 285 540" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrowAdmin)" />

  <!-- CARD 4: Physical Inventory & Damage Audit -->
  <g transform="translate(60, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">Warehouse Inventory &amp; Damage Audit</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Real-Time Stock Tracking</text>
    <text x="40" y="110" fill="#666666" font-size="13">Audited stock for 19 catalogue equipment items in warehouse</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Damage &amp; Loss Logging</text>
    <text x="40" y="170" fill="#666666" font-size="13">Log broken PVC chairs, torn shamianas, or burnt lights post-event</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Tamper-Evident Audit Trail</text>
    <text x="40" y="230" fill="#666666" font-size="13">Every quantity adjustment recorded with timestamp &amp; reason</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">CAPABILITY: Prevents double-booking and tracks asset depreciation</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="510" y1="700" x2="570" y2="700" stroke="#d4af37" stroke-width="3" marker-end="url(#arrowAdmin)" />

  <!-- CARD 5: Staff Attendance & Outside Payments -->
  <g transform="translate(575, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">Staff Attendance &amp; Expense Ledger</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Daily Staff Attendance (₹500/day)</text>
    <text x="40" y="110" fill="#666666" font-size="13">One-click marking: Present (₹500), Half-day (₹250), Absent (₹0)</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Outside Payments (Dhobi &amp; Suppliers)</text>
    <text x="40" y="170" fill="#666666" font-size="13">Dedicated ledger for laundry, bamboo contractors &amp; pickup trucks</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Automatic Wage Rollup</text>
    <text x="40" y="230" fill="#666666" font-size="13">Real-time daily labour liability calculation across active roster</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">IMPACT: Solves local cash leakages and ensures wage fairness</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="1025" y1="700" x2="1085" y2="700" stroke="#d4af37" stroke-width="3" marker-end="url(#arrowAdmin)" />

  <!-- CARD 6: Invoices & Marketing Studio -->
  <g transform="translate(1090, 550)">
    <rect width="450" height="300" rx="16" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#adminShadow)" />
    <rect width="450" height="48" rx="16" fill="#f5ede0" />
    <circle cx="36" cy="24" r="16" fill="url(#adminGrad)" />
    <text x="36" y="30" fill="#d4af37" font-size="14" font-weight="700" text-anchor="middle">6</text>
    <text x="68" y="30" fill="#2a0845" font-size="16" font-weight="700">Commercial Invoicing &amp; Reels</text>
    
    <text x="24" y="85" fill="#2d2d2d" font-size="14" font-weight="600">• Auto Sequential Bills (INV-YYYY-XXXX)</text>
    <text x="40" y="110" fill="#666666" font-size="13">Formal itemized printable letterhead with advance &amp; balance due</text>
    
    <text x="24" y="145" fill="#2d2d2d" font-size="14" font-weight="600">• Dwarka Shri Lawn Video Reels Tab</text>
    <text x="40" y="170" fill="#666666" font-size="13">In-place editing of titles/captions for 7 vertical promotional reels</text>
    
    <text x="24" y="205" fill="#2d2d2d" font-size="14" font-weight="600">• Master AI Agent (3-Layer Memory)</text>
    <text x="40" y="230" fill="#666666" font-size="13">Layer A conversations, Layer B business rules, Layer C workflows</text>

    <rect x="24" y="255" width="402" height="28" rx="6" fill="#faf7f2" />
    <text x="34" y="274" fill="#886016" font-size="11" font-weight="600">DELIVERY: Complete formal billing &amp; modern video marketing suite</text>
  </g>
</svg>